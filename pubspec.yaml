name: care_package
description: Care Package - elderly resident monitoring for UK care homes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.3.3
  path: ^1.9.0

  # Auth / JWT
  jwt_decoder: ^2.0.1

  # Location & maps (Leaflet served via flutter_map / OpenStreetMap)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # Notifications (local; FCM optional, no Firebase by default)
  flutter_local_notifications: ^21.0.0

  # Charts
  fl_chart: ^1.2.0

  # PDF (incident / care reports)
  pdf: ^3.11.0
  printing: ^5.13.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
